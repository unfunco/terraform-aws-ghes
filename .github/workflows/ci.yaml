name: CI

on:
  push:
    branches:
    - main

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1
    - name: Set up Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version: 24
    - name: Render Terraform docs
      uses: terraform-docs/gh-actions@v1.4.1
      with:
        config-file: .terraform-docs.yaml
    - name: Ensure docs are up to date
      run: |
        npx --yes prettier@3.8.3 --write '**/*.md'
        git diff --exit-code HEAD

  terraform-module:
    name: Verify Terraform (module)
    uses: unfunco/meta/.github/workflows/verify-terraform.yaml@ed74a86a4f828ad47a4c65139c4be4101b23a294 # v0.4.0

  terraform-example:
    name: Verify Terraform (complete example)
    uses: unfunco/meta/.github/workflows/verify-terraform.yaml@ed74a86a4f828ad47a4c65139c4be4101b23a294 # v0.4.0
    with:
      terraform-version-file: .terraform-version
      working-directory: examples/complete

  release:
    name: Release?
    needs: [ verify, terraform-module, terraform-example ]
    permissions:
      contents: write
      pull-requests: write
    uses: unfunco/meta/.github/workflows/release-please.yaml@ed74a86a4f828ad47a4c65139c4be4101b23a294 # v0.4.0
